<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">m4ckDev — Cybersecurity & Linux Engineering</title>
  <desc id="desc">A dark red and black cyber-themed profile banner for m4ckDev.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07090d"/>
      <stop offset="0.55" stop-color="#10131a"/>
      <stop offset="1" stop-color="#050608"/>
    </linearGradient>
    <radialGradient id="glow" cx="74%" cy="48%" r="55%">
